<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering Workbench — учебный стенд</title>
<style>body{max-width:720px;margin:8vh auto;padding:24px;font:18px/1.65 system-ui;background:#f7f5ef;color:#213b3d}input,button{font:inherit;padding:10px}input{max-width:100%;box-sizing:border-box}li{padding:10px;border-bottom:1px solid #ccd5cf}#status{min-height:2em}small{display:block}</style>
<h1>Engineering Workbench</h1><p>Локальный учебный стенд: форма → API → JSON-файл.</p>
<form id="form"><label for="title">Заголовок заявки</label><p><input id="title" name="title" autocomplete="off"><button>Сохранить</button></p></form>
<p id="status" role="status" aria-live="polite"></p><ul id="list"></ul><small>Без учётных записей. Только синтетические данные. Один локальный процесс.</small>
<script>
const form = document.getElementById('form'), title = document.getElementById('title');
const status = document.getElementById('status'), list = document.getElementById('list');
async function show() {
  const response = await fetch('/api/requests');
  if (!response.ok) throw Error('Список недоступен: HTTP ' + response.status);
  const rows = await response.json(); list.replaceChildren();
  for (const row of rows) { const li = document.createElement('li'); li.textContent = row.title; list.append(li); }
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button'); button.disabled = true;
  try {
    const response = await fetch('/api/requests', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title: title.value}) });
    const result = await response.json();
    if (!response.ok) throw Error(result.error || 'HTTP ' + response.status);
    title.value = ''; await show(); status.textContent = 'Сохранено: ' + result.id;
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
});
show().catch(error => { status.textContent = error.message; });
</script></html>
